name: Build check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
  private-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
