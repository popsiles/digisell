[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"

# Serve a live sitemap generated from currently published products.
[[redirects]]
  from = "/sitemap.xml"
  to = "https://qpvnfpbzhrszhgukmqpb.supabase.co/functions/v1/store-api/sitemap.xml"
  status = 200
  force = true

# SPA routes: product pages and the private admin login.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
